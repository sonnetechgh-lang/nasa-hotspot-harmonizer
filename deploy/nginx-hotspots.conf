# nginx site for the burning calendar, behind Cloudflare (proxied, SSL mode "Full (strict)").
# setup.sh copies this to /etc/nginx/sites-available/hotspots and fills in DOMAIN.

# Small cache for GET /api/ responses (emptied after each daily refresh)
proxy_cache_path /var/cache/nginx/hotspots levels=1:2 keys_zone=hotspots:20m max_size=500m inactive=24h use_temp_path=off;

upstream hotspots_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN;

    # Cloudflare Origin Certificate (Cloudflare dashboard > SSL/TLS > Origin Server)
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Real visitor IPs from Cloudflare (list written by setup.sh)
    include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 2m;   # drawn polygons are POSTed as GeoJSON
    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript text/csv image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /api/health {
        proxy_pass http://hotspots_app;
    }

    location /api/ {
        proxy_pass http://hotspots_app;
        proxy_read_timeout 120s;

        proxy_cache hotspots;
        proxy_cache_methods GET HEAD;          # POST (drawn areas) is never cached
        proxy_cache_valid 200 6h;
        proxy_cache_use_stale error timeout updating http_502 http_503;   # covers the restart after a refresh
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_pass http://hotspots_app;
    }
}
