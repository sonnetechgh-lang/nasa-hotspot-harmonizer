name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "reports/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # API tests skip here (no data/ in git); the deploy health check covers the live app
      - run: python -m pytest -q -p no:warnings tests
      - name: Docker image builds
        run: docker build -q -t hotspot-harmonizer:ci .

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://harmonizer.10xvibecode.org
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is locked to deploy/deploy.sh on the server; no command is sent
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes root@"$HOST"
      - name: Live check
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://harmonizer.10xvibecode.org/api/health
